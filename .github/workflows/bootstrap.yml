name: Bootstrap project files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project archive
        run: |
          base64 -d project.tar.gz.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz --strip-components=1 -C .
          rm -f project.tar.gz.b64

      - name: Commit project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: bootstrap SKALA Pokedex Cloudflare app'
          git push
